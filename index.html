<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festina Lente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body class="bg-black text-zinc-200 min-h-screen">
  <div class="max-w-screen-md mx-auto px-6 py-16">

    <pre class="text-zinc-500 text-xs leading-relaxed mb-10 whitespace-pre-wrap">/*
 * "Do you want to take the leap of faith,
 *  or become an old man, full of regret,
 *  waiting to die?"
 *                                — Inception
 */</pre>

    <div class="mb-12">
      <h1 class="text-2xl font-bold text-zinc-100 mb-1 tracking-tight">festina_lente</h1>
      <p class="text-zinc-500 text-sm">// make haste, slowly</p>
    </div>

    <div id="list" class="space-y-10"></div>

    <p class="text-center text-zinc-700 text-xs mt-16">// things worth doing, not things worth tracking</p>
  </div>

<script>
fetch('items.txt?v=' + Date.now())
  .then(function (r) { return r.text(); })
  .then(render)
  .catch(function () {
    document.getElementById('list').innerHTML =
      '<p class="text-zinc-600 text-sm">// could not load the list</p>';
  });

function esc(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Parses items.txt.
//   "> Travel"                  -> a category heading
//   "Climb Ben Nevis"           -> an item
//   "Climb Ben Nevis -- 2026-08-15" -> a finished item, with the date shown
//   blank lines and lines starting with # are ignored
function parse(text) {
  var groups = [];
  var current = null;

  text.split(/\r?\n/).forEach(function (raw) {
    var line = raw.trim();
    if (!line || line.charAt(0) === '#') return;

    if (line.charAt(0) === '>') {
      current = { category: line.slice(1).trim(), items: [] };
      groups.push(current);
      return;
    }

    if (!current) {
      current = { category: 'list', items: [] };
      groups.push(current);
    }

    var date = null;
    var text_ = line;
    var m = line.match(/^(.*?)\s*--\s*(\d{4}-\d{2}-\d{2})\s*$/);
    if (m) { text_ = m[1].trim(); date = m[2]; }

    if (text_) current.items.push({ text: text_, date: date });
  });

  return groups.filter(function (g) { return g.items.length; });
}

function render(text) {
  var groups = parse(text);

  document.getElementById('list').innerHTML = groups.map(function (g) {
    return '<div>' +
      '<h2 class="text-zinc-500 text-xs mb-3">// ' + esc(g.category.toLowerCase()) + '</h2>' +
      '<div class="space-y-1">' + g.items.map(itemHtml).join('') + '</div>' +
    '</div>';
  }).join('');
}

function itemHtml(item) {
  var dateTag = item.date
    ? ' <span class="text-zinc-600">— ' + esc(item.date) + '</span>'
    : '';
  return '<div class="flex items-start gap-3 text-sm py-1 text-zinc-200">' +
           '<span class="text-zinc-600">-</span>' +
           '<span>' + esc(item.text) + dateTag + '</span>' +
         '</div>';
}
</script>
</body>
</html>
