<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festina Lente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body class="bg-black text-zinc-200 min-h-screen">
  <div class="max-w-screen-md mx-auto px-6 py-16">

    <pre class="text-zinc-500 text-xs leading-relaxed mb-10 whitespace-pre-wrap">/*
 * "Do you want to take the leap of faith,
 *  or become an old man, full of regret,
 *  waiting to die?"
 *                                — Inception
 */</pre>

    <div class="mb-12">
      <h1 class="text-2xl font-bold text-zinc-100 mb-1 tracking-tight">festina_lente</h1>
      <p class="text-zinc-500 text-sm">// make haste, slowly</p>
    </div>

    <div id="list" class="space-y-10"></div>

    <p class="text-center text-zinc-700 text-xs mt-16">// things worth doing, not things worth tracking</p>
  </div>

<script>
fetch('items.json')
  .then(r => r.json())
  .then(render);

function render(items) {
  const categories = [...new Set(items.map(i => i.category))];

  document.getElementById('list').innerHTML = categories.map(cat => `
    <div>
      <h2 class="text-zinc-500 text-xs mb-3">// ${cat.toLowerCase()}</h2>
      <div class="space-y-1">
        ${items.filter(i => i.category === cat).map(itemHtml).join('')}
      </div>
    </div>
  `).join('');
}

function itemHtml(item) {
  const dateTag = item.done && item.dateCompleted ? ` <span class="text-zinc-600">— ${item.dateCompleted}</span>` : '';
  return `
    <div class="flex items-start gap-3 text-sm py-1 text-zinc-200">
      <span class="text-zinc-600">-</span>
      <span>${item.text}${dateTag}</span>
    </div>`;
}
</script>
</body>
</html>
