<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festina Lente</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div class="max-w-screen-md mx-auto px-6 py-12">
    <div class="mb-10">
      <h1 class="text-3xl font-bold text-white mb-2">🐬⚓ Festina Lente</h1>
      <p class="text-slate-400 text-sm">Make haste, slowly.</p>
    </div>
    <div id="progress" class="mb-10"></div>
    <div id="list" class="space-y-8"></div>
    <p class="text-center text-slate-600 text-xs mt-12">Updated by editing items.json and pushing to git.</p>
  </div>

<script>
fetch('items.json')
  .then(r => r.json())
  .then(render);

function render(items) {
  const done = items.filter(i => i.done).length;
  const pct = items.length ? Math.round(done / items.length * 100) : 0;

  document.getElementById('progress').innerHTML = `
    <div class="flex items-center justify-between text-sm text-slate-400 mb-2">
      <span>${done} of ${items.length} done</span>
      <span>${pct}%</span>
    </div>
    <div class="w-full bg-slate-800 rounded-full h-2">
      <div class="bg-emerald-500 h-2 rounded-full transition-all" style="width:${pct}%"></div>
    </div>`;

  const categories = [...new Set(items.map(i => i.category))];

  document.getElementById('list').innerHTML = categories.map(cat => `
    <div>
      <h2 class="text-slate-500 text-xs uppercase tracking-wide mb-3">${cat}</h2>
      <div class="space-y-2">
        ${items.filter(i => i.category === cat).map(itemHtml).join('')}
      </div>
    </div>
  `).join('');
}

function itemHtml(item) {
  return `
    <div class="flex items-start gap-3 bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 ${item.done ? 'opacity-50' : ''}">
      <div class="mt-0.5 text-lg">${item.done ? '✅' : '⬜'}</div>
      <div class="flex-1">
        <p class="text-white text-sm ${item.done ? 'line-through text-slate-500' : ''}">${item.text}</p>
        ${item.done && item.dateCompleted ? `<p class="text-emerald-500 text-xs mt-1">Done · ${item.dateCompleted}</p>` : ''}
        ${item.note ? `<p class="text-slate-500 text-xs mt-1">${item.note}</p>` : ''}
      </div>
    </div>`;
}
</script>
</body>
</html>
